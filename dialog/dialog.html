<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Send add-in activation</title>
  <link href="../shared/base.css" rel="stylesheet">
  <link href="dialog.css" rel="stylesheet">
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script src="dialog.js" defer></script>
</head>
<body>
  <main>
    <p>
      This sends an actionable message to your own mailbox with two buttons:
    </p>
    <ul>
      <li>One opens this add-in's <strong>View Initialization Context</strong> pane with the context below.</li>
      <li>One opens the <a href="https://appsource.microsoft.com/en-us/product/office/WA104005406" target="_blank" rel="noopener">Message Header Analyzer</a> store add-in.</li>
    </ul>

    <label for="init-context"><h2>Initialization context</h2></label>
    <p class="hint">Edit it as you like. It has to be a valid JSON object.</p>
    <textarea id="init-context" spellcheck="false" rows="10"></textarea>

    <div id="error" class="banner banner-error" role="alert" hidden>
      <strong>Error</strong>
      <pre><code id="error-msg"></code></pre>
    </div>

    <button id="send-msg" type="button" class="primary">Send message</button>
  </main>
</body>
</html>
